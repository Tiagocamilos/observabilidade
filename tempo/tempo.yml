# OBJETIVO (Início): Configurar o Grafana Tempo em modo monolítico para receber traces OTLP
# encaminhados pelo Alloy e armazená-los localmente em blocos para busca via TraceQL.

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

# Metrics-generator: deriva métricas a partir dos spans e envia ao Prometheus (remote write).
# - service-graphs: alimenta o "Service Graph" (aresta loja-api -> pagamento-service)
# - span-metrics:   taxa/erros/latência por span (traces_spanmetrics_*)
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /tmp/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]

# RESUMO FINAL (Fim): Fornece o backend de rastreamento distribuído da stack.
