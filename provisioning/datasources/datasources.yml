# OBJETIVO (Início): Provisionar automaticamente no Grafana as três fontes de dados (Prometheus,
# Loki e Tempo) e configurar a correlação bidirecional Logs <-> Traces via trace_id.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Exemplars: cada ponto do histograma carrega um trace_id -> link direto para o Tempo
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
          name: TraceID
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{service="$${__span.tags["service.name"]}"} | json | trace_id="$${__span.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: service
        queries:
          - name: Taxa de requisições do serviço
            query: 'sum(rate(http_requests_total{$$__tags}[1m]))'
          - name: Latência p95 do serviço
            query: 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{$$__tags}[1m])))'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

# RESUMO FINAL (Fim): Garante que o Grafana suba 100% conectado aos 3 backends com correlação bidirecional.
